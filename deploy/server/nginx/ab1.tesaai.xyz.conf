map $http_upgrade $aistudio_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ab1.tesaai.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://ab1.tesaai.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ab1.tesaai.xyz;

    ssl_certificate /etc/letsencrypt/live/ab1.tesaai.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ab1.tesaai.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/aistudio2api_access.log;
    error_log /var/log/nginx/aistudio2api_error.log;
    client_max_body_size 1g;

    location / {
        proxy_pass http://127.0.0.1:12048;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aistudio_connection_upgrade;
        proxy_connect_timeout 15s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        send_timeout 1800s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }
}

# The client uses the configured preview port on the current domain.
# Bind the public address so the backend can keep its loopback listener.
server {
    listen 198.23.152.126:12050 ssl;
    server_name ab1.tesaai.xyz;

    ssl_certificate /etc/letsencrypt/live/ab1.tesaai.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ab1.tesaai.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /shim.html {
        proxy_pass http://127.0.0.1:12050;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
